<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA - My Account / ARC - Mon dossier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="banner">
            <div class="brand">
                <img src="https://www.canada.ca/etc/designs/canada/wet-boew/assets/sig-blk-en.svg" alt="Government of Canada / Gouvernement du Canada">
            </div>
            <div class="lang-toggle">
                <a href="#">Français</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="login-box">
            <div class="option">
                <p><b>NOTE:</b> This is a sample phishing website for COMP8003. No data will be submitted.</p>
            </div>

            <div class="option">
                <h2>CRA Sign-In</h2>
                <p>Log in with your CRA credentials.</p>
                <form onsubmit="return false;">
                    <label for="username">User ID</label>
                    <input type="text" id="username" name="username">
                    
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                    
                    <button type="button" class="btn-primary" disabled>Login</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Definitely NOT the Canada Revenue Agency</p>
    </footer>
</body>
</html>
